name: CareerForge AI — Daily Cloud Job Hunter

on:
  schedule:
    # Runs every day at 08:00 AM UTC (9:00 AM Tunisia time)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  job-hunter:
    name: Run AI Job Search & Application Generator
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: 🚀 Run AI Job Search & Telegram Alert Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'openrouter/free' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_MATCH_SCORE: ${{ secrets.MIN_MATCH_SCORE || '70' }}
        run: |
          node scripts/cloud-job-hunter.js

      - name: 📄 Upload Generated PDF Applications
        uses: actions/upload-artifact@v4
        with:
          name: application-packages-${{ github.run_number }}
          path: |
            data/cv/customized/*.pdf
            data/applications/*.pdf
          retention-days: 14
