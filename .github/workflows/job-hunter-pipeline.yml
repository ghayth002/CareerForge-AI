name: CareerForge AI — Daily Cloud Job Hunter & Hosted Dashboard

on:
  schedule:
    # Runs every day at 08:00 AM UTC (9:00 AM Tunisia time)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  job-hunter:
    name: Run AI Job Search, Generate PDFs & Deploy Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab

      - name: 🚀 Run AI Job Search & Telegram Alert Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'openrouter/free' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_MATCH_SCORE: ${{ secrets.MIN_MATCH_SCORE || '70' }}
        run: |
          node scripts/cloud-job-hunter.js

      - name: 📊 Build Static Dashboard Bundle for GitHub Pages
        run: |
          node scripts/build-static-dashboard.js

      - name: 🌐 Deploy Hosted Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true

      - name: 📄 Upload Generated PDF Applications
        uses: actions/upload-artifact@v4
        with:
          name: application-packages-${{ github.run_number }}
          path: |
            data/cv/customized/*.pdf
            data/applications/*.pdf
          retention-days: 14
