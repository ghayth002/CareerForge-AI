services:
  - type: web
    name: careerforge-ai
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DASHBOARD_PASSCODE
        value: CareerForge2026!
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
